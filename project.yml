name: Shir
options:
  bundleIdPrefix: com.shirhussain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ShirKit:
    path: ShirKit

targets:
  Shir:
    type: application
    platform: iOS
    sources:
      # The injected player scripts live in ShirKit, not here — SwiftPM handles
      # them as package resources, and that is what lets them be unit-tested
      # with JavaScriptCore instead of needing a simulator.
      - path: Shir
    dependencies:
      - package: ShirKit
        product: ShirKit
    info:
      path: Shir/Resources/Info.plist
      properties:
        CFBundleDisplayName: Shir
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Required by both engines: AVPlayer for imported files, WebKit media
        # for YouTube. One of the four background-audio requirements — the
        # list lives in CLAUDE.md §5 rule 10, not here.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirhussain.shir
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: D26BZ945D3
        CODE_SIGN_STYLE: Automatic
        # Device builds must be signed or iOS refuses to launch them
        # ("The executable is not codesigned"). The simulator has no such
        # requirement and has no identity configured, so the opt-out is scoped
        # to the simulator SDK rather than applied to every build.
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": NO

  ShirUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ShirUITests
    dependencies:
      - target: Shir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirhussain.shir.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Shir:
    build:
      targets:
        Shir: all
        ShirUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShirUITests
