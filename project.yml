name: Shir
options:
  bundleIdPrefix: com.shirhussain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ShirKit:
    path: ShirKit

targets:
  Shir:
    type: application
    platform: iOS
    sources:
      # .js has no default build phase in Xcode, so the injected player scripts
      # are split out and forced into Resources. Without this,
      # Bundle.main.url(forResource:withExtension:"js") returns nil at runtime
      # and every script silently goes missing — which presents as "the ads are
      # back", not as a build error.
      - path: Shir
        excludes:
          - "Resources/Scripts/**"
      - path: Shir/Resources/Scripts
        buildPhase: resources
    dependencies:
      - package: ShirKit
        product: ShirKit
    info:
      path: Shir/Resources/Info.plist
      properties:
        CFBundleDisplayName: Shir
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Required by both engines. AVPlayer needs it for imported files, and
        # WebKit media needs it plus an active .playback session plus the
        # visibility overrides in BackgroundPlay.js — all three, or playback
        # stops the moment the screen locks.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirhussain.shir
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Lets the simulator build run without a signing identity configured.
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: NO

  ShirUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ShirUITests
    dependencies:
      - target: Shir
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirhussain.shir.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Shir:
    build:
      targets:
        Shir: all
        ShirUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShirUITests
