# Phase 0 spike — throwaway. See spike/README.md.
#
# Deliberately a separate project from Shir so it can be deleted with
# `rm -rf spike/` once it has answered its question, and so nothing here can
# accidentally become load-bearing.
name: BackgroundPlaySpike

options:
  bundleIdPrefix: com.shirhussain.shir
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  BackgroundPlaySpike:
    type: application
    platform: iOS
    sources:
      # .js has no default build phase in Xcode, so the Scripts folder is
      # split out and forced into Resources. Without this,
      # Bundle.main.url(forResource:withExtension:"js") returns nil at runtime
      # and every injected script silently goes missing.
      - path: Sources
        excludes:
          - "Scripts/**"
      - path: Sources/Scripts
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: BG Spike
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # The whole point: without this the app is suspended on background and
        # nothing below can possibly work.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shirhussain.shir.spike
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
